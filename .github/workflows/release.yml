# Builds the Windows installer and publishes it as a GitHub Release.
# Installed copies of Stuadio pick the new release up automatically (in-app update prompt).
#
# To ship a new version:
#   1. npm version patch   (bumps package.json and creates the tag)
#   2. git push origin main --tags
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check tag matches package.json version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1; }

      - name: Engine self-test
        run: npm test

      # Build only. Publishing is a separate single step so all files land in ONE release
      # (electron-builder's parallel uploads can otherwise create duplicate releases).
      - name: Build installer
        run: npx electron-builder --win nsis --publish never

      # One release per tag containing exactly the three files the auto-updater needs:
      # the installer, its .blockmap (enables small differential updates) and latest.yml.
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files="dist/Stuadio-Setup-${GITHUB_REF_NAME#v}.exe dist/Stuadio-Setup-${GITHUB_REF_NAME#v}.exe.blockmap dist/latest.yml"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files --title "Stuadio ${GITHUB_REF_NAME#v}" --generate-notes
          fi
